name: Windows build
run-name: Windows build · ${{ github.ref_name }} · ${{ github.run_number }}

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 portable
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/out/vcpkg-cache,readwrite
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Calculate build version
        id: version
        run: |
          python tools/ci_build.py version --run ${{ github.run_number }} --attempt ${{ github.run_attempt }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: out/vcpkg-cache
          key: vcpkg-windows-2022-x64-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-windows-2022-x64-${{ hashFiles('vcpkg.json') }}-
      - name: Bootstrap pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git out/tools/vcpkg
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git -C out/tools/vcpkg checkout --detach $baseline
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./out/tools/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Configure
        run: |
          cmake -S . -B out/build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$PWD/out/tools/vcpkg/scripts/buildsystems/vcpkg.cmake" "-DBLOBBY_BUILD_VERSION=${{ steps.version.outputs.version }}" "-DBLOBBY_BUILD_NUMBER=${{ github.run_number }}"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build game, server, assets and tests
        run: |
          cmake --build out/build --config Release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/build --config Release --target controller-test display-viewport-test assets-smoke-test --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python -m unittest discover -s test -p "test_ci_build.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s test -p "test_git_conventions.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./out/build/src/Release/controller-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./out/build/src/Release/display-viewport-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package and validate
        run: |
          $package = & ./tools/package_friends.ps1
          if (!$package -or !(Test-Path (Join-Path $package 'blobby.exe'))) { throw 'Packaging failed' }
          python tools/ci_build.py package --package $package --version "${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force out/smoke | Out-Null
          & ./out/build/src/Release/assets-smoke-test.exe (Join-Path $package data) "$PWD/out/smoke" --audio-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload portable build and matching source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BlobbyVolley2HD-${{ steps.version.outputs.version }}-Windows-x64
          path: out/publish/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/build/CMakeFiles/CMakeConfigureLog.yaml
            out/build/vcpkg-manifest-install.log
            out/tools/vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore

  publish:
    name: Publish automatic development release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: BlobbyVolley2HD-${{ needs.build.outputs.version }}-Windows-x64
          path: publish
      - name: Publish versioned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          gh release create "v$BUILD_VERSION" publish/* --target "$BUILD_COMMIT" --title "Blobby Volley 2 HD $BUILD_VERSION" --prerelease --notes "Automatic Windows x64 build from commit $BUILD_COMMIT. Extract the complete Windows ZIP and run Start-Blobby.cmd. Matching source and SHA-256 checksums are attached."
